document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"c0df59aa-449c-40f4-9922-fca5e1dfce8a\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n  <style>/* SmartFridge — Color tokens\n   Lifted verbatim from src/constants/colors.js + category config.\n   Primary brand is the \"fresh green\" #2CA456. */\n\n:root {\n  /* ---- Brand green ramp ---- */\n  --green-50:  #EAF7EF;\n  --green-100: #C6EDD3;\n  --green-400: #3DBF6B;\n  --green-500: #2CA456; /* primary */\n  --green-600: #1E7A3F; /* dark / pressed */\n\n  /* ---- Neutrals (Google-grey family) ---- */\n  --white:    #FFFFFF;\n  --gray-50:  #F8F9FA;\n  --gray-100: #F1F3F4;\n  --gray-200: #E8EAED;\n  --gray-300: #DADCE0;\n  --gray-400: #BDC1C6;\n  --gray-500: #9AA0A6;\n  --gray-700: #3C4043;\n\n  /* slate accents used on Settings surfaces */\n  --slate-50:  #F8FAFC;\n  --slate-100: #F1F5F9;\n  --slate-200: #E2E8F0;\n  --slate-900: #0F172A;\n\n  /* ---- Semantic status ---- */\n  --red-50:    #FFEBEE;\n  --red-400:   #E53935;\n  --orange-50: #FFF3E0;\n  --orange-400:#FB8C00;\n  --orange-600:#E65100;\n  --yellow-50: #FFFDE7;\n  --yellow-400:#F9A825;\n  --blue-50:   #E3F2FD;\n  --blue-700:  #1565C0;\n\n  /* ---- Category palette (product chips/icons) ---- */\n  --cat-lacteos:     #FB8C00;  --cat-lacteos-bg:     #FFF3E0;\n  --cat-carnes:      #E53935;  --cat-carnes-bg:      #FFEBEE;\n  --cat-frutas:      #9C27B0;  --cat-frutas-bg:      #F3E5F5;\n  --cat-verduras:    #4CAF50;  --cat-verduras-bg:    #E8F5E9;\n  --cat-bebidas:     #1565C0;  --cat-bebidas-bg:     #E3F2FD;\n  --cat-congelados:  #0288D1;  --cat-congelados-bg:  #E1F5FE;\n  --cat-despensa:    #795548;  --cat-despensa-bg:    #EFEBE9;\n  --cat-snacks:      #FB8C00;  --cat-snacks-bg:      #FFF3E0;\n  --cat-otro:        #9AA0A6;  --cat-otro-bg:        #F1F3F4;\n\n  /* =========================================================\n     SEMANTIC ALIASES — prefer these in components\n     ========================================================= */\n  --brand:            var(--green-500);\n  --brand-dark:       var(--green-600);\n  --brand-tint:       var(--green-50);\n\n  --bg-app:           var(--gray-50);   /* default screen background */\n  --bg-app-alt:       var(--slate-50);  /* settings background */\n  --surface-card:     var(--white);\n  --surface-sunken:   var(--gray-50);   /* input fills */\n\n  --text-strong:      var(--gray-700);  /* primary text/headings */\n  --text-muted:       var(--gray-500);  /* secondary/captions */\n  --text-faint:       var(--gray-400);  /* uppercase labels, placeholders */\n  --text-on-brand:    var(--white);\n  --text-on-brand-soft: rgba(255,255,255,0.8);\n\n  --border-card:      var(--gray-300);  /* hairline card border */\n  --border-input:     var(--gray-300);\n  --border-soft:      var(--slate-200);\n  --divider:          var(--slate-100);\n\n  --status-expired:   var(--red-400);\n  --status-urgent:    var(--red-400);\n  --status-soon:      var(--orange-400);\n  --status-ok:        var(--yellow-400);\n  --status-good:      var(--green-500);\n}\n<\/style>\n  <style>/* SmartFridge — Typography tokens\n   The app is React Native + Expo, so it renders in the device's NATIVE\n   system font (San Francisco on iOS, Roboto on Android). For web/HTML\n   recreations we mirror that with a system-ui stack — no custom webfont\n   ships with the product. Weights observed: 500 / 600 / 700. */\n\n:root {\n  --font-sans: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto,\n               \"Helvetica Neue\", system-ui, sans-serif;\n  --font-mono: ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* Weights */\n  --fw-medium:   500; /* @kind other */\n  --fw-semibold: 600; /* @kind other */\n  --fw-bold:     700; /* @kind other */\n\n  /* Type scale — px values pulled from the RN StyleSheets */\n  --fs-10: 10px;  /* micro labels, tag text */\n  --fs-11: 11px;  /* card meta / dates */\n  --fs-12: 12px;  /* captions, section labels */\n  --fs-13: 13px;  /* row labels, list item titles */\n  --fs-14: 14px;  /* body / inputs / buttons */\n  --fs-15: 15px;  /* primary button text */\n  --fs-18: 18px;  /* summary icons / sub-headings */\n  --fs-19: 19px;  /* profile name */\n  --fs-20: 20px;  /* card titles */\n  --fs-22: 22px;  /* greeting name, big numbers */\n  --fs-28: 28px;  /* app name / display */\n\n  --lh-tight:  1.15; /* @kind other */\n  --lh-snug:   1.3;  /* @kind other */\n  --lh-normal: 1.5;  /* @kind other */\n\n  --tracking-tight:  -0.2px;\n  --tracking-normal: 0;\n  --tracking-wide:   0.5px;\n  --tracking-caps:   1px;   /* uppercase section labels */\n\n  /* ---- Semantic roles ---- */\n  --text-display:  var(--fw-bold) var(--fs-28)/var(--lh-tight) var(--font-sans);\n  --text-title:    var(--fw-bold) var(--fs-20)/var(--lh-snug) var(--font-sans);\n  --text-heading:  var(--fw-semibold) var(--fs-18)/var(--lh-snug) var(--font-sans);\n  --text-body:     var(--fw-medium) var(--fs-14)/var(--lh-normal) var(--font-sans);\n  --text-label:    var(--fw-semibold) var(--fs-12)/var(--lh-snug) var(--font-sans);\n  --text-caption:  var(--fw-medium) var(--fs-11)/var(--lh-snug) var(--font-sans);\n}\n<\/style>\n  <style>/* SmartFridge — Spacing, radii, shadows\n   Screen gutters are 16px; cards round at 12px (content) to 24px (settings). */\n\n:root {\n  /* Spacing scale (px) */\n  --space-1:  2px;\n  --space-2:  4px;\n  --space-3:  6px;\n  --space-4:  8px;\n  --space-5:  10px;\n  --space-6:  12px;\n  --space-7:  14px;\n  --space-8:  16px;  /* default screen gutter */\n  --space-10: 20px;\n  --space-12: 24px;\n  --space-14: 28px;\n  --space-16: 32px;\n\n  --gutter: var(--space-8);\n\n  /* Radii */\n  --radius-sm:   9px;   /* icon boxes */\n  --radius-md:   12px;  /* summary/alert cards, buttons */\n  --radius-lg:   16px;\n  --radius-xl:   20px;  /* login card */\n  --radius-2xl:  24px;  /* settings cards, header sheet */\n  --radius-3xl:  32px;  /* profile header sheet */\n  --radius-pill: 999px; /* tags, chips */\n\n  /* Shadows — soft, low-opacity, cool slate cast */\n  --shadow-card:   0 4px 10px rgba(15,23,42,0.03);\n  --shadow-raised: 0 4px 12px rgba(0,0,0,0.12);\n  --shadow-header: 0 8px 16px rgba(15,23,42,0.06);\n\n  /* Hairline border used across cards */\n  --border-hairline: 1px solid var(--border-card);\n}\n<\/style>\n  <style>\n    html, body { margin: 0; background: #0d1411; overflow: hidden; }\n    * { box-sizing: border-box; }\n    @keyframes sf-sheet-in { from { opacity: 0; transform: translateY(40px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }\n    @keyframes sf-scrim-in { from { opacity: 0; } to { opacity: 1; } }\n    @keyframes sf-view-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }\n    .sf-pill { cursor: pointer; transition: transform 0.14s ease, box-shadow 0.14s ease; -webkit-tap-highlight-color: transparent; user-select: none; }\n    .sf-pill:active { transform: scale(0.96); box-shadow: 0 3px 8px rgba(15,23,42,0.05); }\n    .sf-view { animation: sf-view-in 0.32s cubic-bezier(0.16,1,0.3,1); }\n  <\/style>\n<\/helmet>\n\n\n\n<div style=\"position:fixed; inset:0; overflow:hidden; display:flex; align-items:center; justify-content:center;\">\n<div style=\"position:relative; width:1920px; height:1080px; flex:0 0 auto; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',system-ui,sans-serif; background:radial-gradient(120% 115% at 50% -12%, #EAF7EF 0%, #EDF3EF 46%, #E1E9E4 100%); transform:scale({{ stageScale }}); transform-origin:center center;\">\n\n  <!-- static ambient produce blobs -->\n  <div style=\"position:absolute; left:8%; top:16%; width:320px; height:320px; border-radius:50%; background:rgba(44,164,86,0.07); filter:blur(12px);\"><\/div>\n  <div style=\"position:absolute; right:7%; top:10%; width:230px; height:230px; border-radius:50%; background:rgba(61,191,107,0.08); filter:blur(10px);\"><\/ eight:52px; border-radius:50%; background:#fff; border:1px solid #DADCE0; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(15,23,42,0.04); flex:0 0 auto;\">\n          <sc-if value=\"{{ isFullscreen }}\" hint-placeholder-val=\"{{ false }}\">\n            <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3C4043\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 3v3a2 2 0 0 1-2 2H3\"><\/path><path d=\"M21 8h-3a2 2 0 0 1-2-2V3\"><\/path><path d=\"M3 16h3a2 2 0 0 1 2 2v3\"><\/path><path d=\"M16 21v-3a2 2 0 0 1 2-2h3\"><\/path><\/svg>\n          <\/sc-if>\n          <sc-if value=\"{{ !isFullscreen }}\" hint-placeholder-val=\"{{ true }}\">\n            <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3C4043\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 3H5a2 2 0 0 0-2 2v3\"><\/path><path d=\"M21 8V5a2 2 0 0 0-2-2h-3\"><\/path><path d=\"M3 16v3a2 2 0 0 0 2 2h3\"><\/path><path d=\"M16 21h3a2 2 0 0 0 2-2v-3\"><\/path><\/svg>\n          <\/sc-if>\n        <\/div>\n      <\/sc-if>\n    <\/div>\n  <\/div>\n\n  <!-- ============ TAB NAV ============ -->\n  <div style=\"position:absolute; top:158px; left:0; right:0; display:flex; justify-content:center; z-index:5;\">\n    <div style=\"display:flex; gap:8px; background:#fff; border:1px solid #DADCE0; border-radius:999px; padding:8px; box-shadow:0 8px 22px rgba(15,23,42,0.06);\">\n      <div class=\"sf-pill\" role=\"button\" tabindex=\"0\" onclick=\"{{ goInicio }}\" onkeydown=\"{{ goInicioKbd }}\" style=\"{{ tabInicioStyle }}\">Inicio<\/div>\n      <div class=\"sf-pill\" role=\"button\" tabindex=\"0\" onclick=\"{{ goSaber }}\" onkeydown=\"{{ goSaberKbd }}\" style=\"{{ tabSaberStyle }}\">¿Sabías qué?<\/div>\n      <div class=\"sf-pill\" role=\"button\" tabindex=\"0\" onclick=\"{{ goJuego }}\" onkeydown=\"{{ goJuegoKbd }}\" style=\"{{ tabJuegoStyle }}\">Juego<\/div>\n 24\" fill=\"none\" stroke=\"#E53935\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"><\/path><path d=\"M12 9v4\"><\/path><path d=\"M12 17h.01\"><\/path><\/svg>\n            <\/span>\n            <span style=\"font-size:25px; font-weight:600; color:#3C4043;\">Alertas de vencimiento<\/span>\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#BDC1C6\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\/path><\/svg>\n          <\/div>\n          <div class=\"sf-pill\" role=\"button\" tabindex=\"0\" onclick=\"{{ openEscaner }}\" onkeydown=\"{{ openEscanerKbd }}\" style=\"display:flex; align-items:center; gap:14px; background:#fff; border:1px solid #DADCE0; border-radius:999px; padding:18px 28px; box-shadow:0 6px 16px rgba(15,23,42,0.04);\">\n            <span style=\"width:44px; height:44px; border-radius:14px; background:#EAF7EF; display:flex; align-items:center; justify-content:center; flex:0 0 auto;\">\n              <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2CA456\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2\"><\/path><path d=\"M17 3h2a2 2 0 0 1 2 2v2\"><\/path><path d=\"M21 17v2a2 2 0 0 1-2 2h-2\"><\/path><path d=\"M7 21H5a2 2 0 0 1-2-2v-2\"><\/path><path d=\"M7 12h10\"><\/path><\/svg>\n            <\/span>\n            <span style=\"font-size:25px; font-weight:600; color:#3C4043;\">Escáner de códigos<\/span>\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#BDC1C6\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\/path><\/svg>\n          <\/div>\n          <div class=\"sf-pill\" role=\"button\" tabindex=\"0\" onclick=\"{{ openChef }}\" onkeydown=\"{{ openChefKbd }}\" style=\"display:flex; align-items:center; gap:14px; background:#fff; border:1px solid #DADCE0; border-radius:999px; padding:18px 28px; box-shadow:0 6px 16px rgba(15,23,42,0.04);\">\n            <span style=\"width:44px; height:44px; border-radius:14px; background:#EAF7EF; display:flex; align-items:center; justify-content:center; flex:0 0 auto;\">\n              <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2CA456\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v4\"><\/path><path d=\"M12 17v4\"><\/path><path d=\"M3 12h4\"><\/path><path d=\"M17 12h4\"><\/path><path d=\"M6.3 6.3l2.4 2.4\"><\/path><path d=\"M15.3 15.3l2.4 2.4\"><\/path><path d=\"M17.7 6.3l-2.4 2.4\"><\/path><path d=\"M8.7 15.3l-2.4 2.4\"><\/path><\/svg>\n            <\/span>\n            <span style=\"font-size:25px; font-weight:600; color:#3C4043;\">Chef IA<\/span>\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#BDC1C6\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\/path><\/svg>\n          <\/div>\n        <\/div>\n        <div style=\"font-size:19px; font-weight:500; color:#BDC1C6; margin-top:26px; letter-spacing:0.3px;\">Toca una función para ver más<\/div>\n      <\/div>\n    <\/sc-if>\n\n    <!-- ---------- VIEW: ¿SABÍAS QUÉ? ---------- -->\n    <sc-if value=\"{{ isSaber }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"sf-view\" style=\"display:flex; flex-direction:column; align-items:center; text-align:center; width:100%;\">\n        <div style=\"font-size:56px; font-weight:700; letter-spacing:-1.5px; color:#3C4043;\">Curiosidades del refrigerador<\/div>\n        <div style=\"font-size:26px; font-weight:500; color:#9AA0A6; margin-top:14px;\">Toca cada tarjeta para descubrir el dato.<\/div>\n        <div style=\"display:grid; grid-template-columns:repeat(2, 1fr); gap:24px; margin-top:44px; width:100%; max-width:1300px;\">\ yle=\"font-size:22px; font-weight:500; color:#5F6368; margin-top:16px; line-height:1.35;\">{{ quizVerdict }}<\/div>\n              <div class=\"sf-pill\" role=\"button\" tabindex=\"0\" onclick=\"{{ quizRestart }}\" onkeydown=\"{{ quizRestartKbd }}\" style=\"display:inline-flex; align-items:center; justify-content:center; gap:10px; margin-top:26px; background:#2CA456; border-radius:999px; padding:16px 34px; font-size:22px; font-weight:700; color:#fff; box-shadow:0 12px 26px rgba(44,164,86,0.28);\">\n                <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"><\/path><path d=\"M3 3v5h5\"><\/path><\/svg>\n                Jugar de nuevo\n              <\/div>\n            <\/div>\n            <!-- right: leaderboard -->\n            <div style=\"flex:1; display:flex; flex-direction:column; text-align:left;\">\n              <div style=\"display:flex; align-items:center; gap:10px; font-size:24px; font-weight:700; color:#3C4043; letter-spacing:-0.3px;\">\n                <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F5A623\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9H4.5a2.5 2.5 0 0 1 0-5H6\"><\/path><path d=\"M18 9h1.5a2.5 2.5 0 0 0 0-5H18\"><\/path><path d=\"M4 22h16\"><\/path><path d=\"M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22\"><\/path><path d=\"M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22\"><\/path><path d=\"M18 2H6v7a6 6 0 0 0 12 0V2Z\"><\/path><\/svg>\n                Mejores puntajes\n              <\/div>\n              <sc-if value=\"{{ canRegister }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex; gap:10px; margin-top:16px;\">\n                  <input value=\"{{ nameInput }}\" oninput=\"{{ onName }}\" onkeydown=\"{{ onNameKeyDown }}\" maxlength=\"14\" y:flex; align-items:center; gap:26px;\">\n      <div style=\"width:70px; height:70px; border-radius:20px; background:rgba(255,255,255,0.16); display:flex; align-items:center; justify-content:center; flex:0 0 auto;\">\n        <svg width=\"36\" height=\"36\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z\"><\/path><path d=\"M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12\"><\/path><\/svg>\n      <\/div>\n      <div>\n        <div style=\"font-size:40px; font-weight:700; color:#fff; letter-spacing:-0.5px;\">Menos comida a la basura, más ahorro en casa<\/div>\n        <div style=\"font-size:22px; font-weight:500; color:rgba(255,255,255,0.82); margin-top:4px;\">SmartFridge cuida tu refrigerador por ti.<\/div>\n      <\/div>\n    <\/div>\n    <div style=\"display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.3); border-radius:999px; padding:14px 28px;\">\n      <span style=\"width:9px; height:9px; border-radius:50%; background:#fff;\"><\/span>\n      <span style=\"font-size:22px; font-weight:600; color:#fff; letter-spacing:0.5px; text-transform:uppercase;\">Grupo 4 · Ingeniería de Software<\/span>\n    <\/div>\n  <\/div>\n\n  <!-- ============ DETAIL SHEET (tap to open) ============ -->\n  <sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ close }}\" style=\"position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; background:rgba(15,23,42,0.38); backdrop-filter:blur(3px); animation:sf-scrim-in 0.2s ease;\">\n      <div onclick=\"{{ stop }}\" role=\"dialog\" aria-modal=\"true\" aria-label=\"{{ modalTitle }}\" style=\"position:relative; width:820px; background:#fff; border-radius:32px; padding:64px 64px 56px; box-shadow:0 40px 90px rgba(15,23,42,0.28); animation:sf-sheet-in 0.28s cubic-bezier(0.16,1,0.3,1); text-align:center;\">\n        <div id=\"sf-modal-close\" onclick=\"{{ close }}\" onkeydown=\"{{ closeKbd }}\" class=\"sf-pill\" role=\"button\" tabindex=\"0\" aria-label=\"Cerrar\" style=\"position:absolute; top:28px; right:28px; width:52px; height:52px; border-radius:50%; background:#F1F3F4; display:flex; align-items:center; justify-content:center;\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6368\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 6 18\"><\/path><path d=\"m6 6 12 12\"><\/path><\/svg>\n        <\/div>\n        <div style=\"width:112px; height:112px; border-radius:30px; background:{{ modalTint }}; display:flex; align-items:center; justify-content:center; margin:0 auto 32px;\">\n          {{ modalIcon }}\n        <\/div>\n        <div style=\"display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:20px;\">\n          <span style=\"width:28px; height:4px; border-radius:2px; background:{{ modalColor }};\"><\/span>\n          <span style=\"font-size:20px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:{{ modalColor }};\">{{ modalKicker }}<\/span>\n        <\/div>\n        <div style=\"font-size:52px; font-weight:700; letter-spacing:-1px; line-height:1.1; color:#3C4043;\">{{ modalTitle }}<\/div>\n        <sc-if value=\"{{ !modalIsLeaderboard }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size:27px; font-weight:500; color:#5F6368; margin-top:24px; line-height:1.46;\">{{ modalBody }}<\/div>\n        <\/sc-if>\n        <sc-if value=\"{{ modalIsLeaderboard }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:28px; text-align:left; display:flex; flex-direction:column; gap:9px;\">\n            <sc-if value=\"{{ hasScores }}\" hint-placeholder-val=\"{{ false }}\">\n              <sc-for list=\"{{ scoreboard }}\" as=\"row\" hint-placeholder-count=\"3\">\n                <div style=\"{{ row.style }}\">\n                  <span style=\"{{ row.rankStyle }}\">{{ row.rank }}<\/span>\n                  <span style=\"flex:1; font-size:21px; font-weight:600; color:#3C4043; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ row.name }}<\/span>\n                  <span style=\"font-size:21px; font-weight:700; color:#2CA456;\">{{ row.score }}<\/span>\n                <\/div>\n              <\/sc-for>\n            <\/sc-if>\n            <sc-if value=\"{{ noScores }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:20px; font-weight:500; color:#BDC1C6; padding:12px 0; text-align:center;\">Aún no hay puntajes. ¡Juega en la pestaña \"Juego\" y sé el primero!<\/div>\n            <\/sc-if>\n          <\/div>\n        <\/sc-if>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n<\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { view: \"inicio\", modalKey: null, qIndex: 0, score: 0, selected: null, showResult: false, scores: [], nameInput: \"\", saved: false, lastSaved: null,\n    vw: typeof window !== \"undefined\" ? window.innerWidth : 1920, vh: typeof window !== \"undefined\" ? window.innerHeight : 1080,\n    isFullscreen: false };\n\n  componentDidMount() {\n    try { this.setState({ scores: JSON.parse(localStorage.getItem(\"sf_leaderboard\") || \"[]\") }); } catch (e) {}\n    this.idleReset = () => {\n      clearTimeout(this.idleTimer);\n      this.idleTimer = setTimeout(() => this.goHome(), 45000);\n    };\n    this.idleEvents = [\"pointerdown\", \"keydown\", \"touchstart\", \"wheel\"];\n    this.idleEvents.forEach(ev => document.addEventListener(ev, this.idleReset, true));\n    this.idleReset();\n\n    this.onResize = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight });\n    window.addEventListener(\"resize\", this.onResize);\n\n    // While the detail modal is open: Escape closes it, and Tab is trapped\n    // on the close button — its only focusable element — so keyboard users\n    // can't tab into the (visually covered) page behind the scrim.\n    this.onModalKeys = (e) => {\n      if (!this.state.modalKey) return;\n      if (e.key === \"Escape\") {\n        this.setState({ modalKey: null });\n        return;\n      }\n      if (e.key === \"Tab\") {\n        e.preventDefault();\n        const btn = document.getElementById(\"sf-modal-close\");\n        if (btn) btn.focus();\n      }\n    };\n    document.addEventListener(\"keydown\", this.onModalKeys);\n\n    // Fullscreen state can change from outside our button too (Android's\n    // back gesture, Esc on desktop, browser UI) — listen with vendor\n    // prefixes since Android WebView/older Chrome still fire the prefixed\n    // event name. Recompute vw/vh here too: some browsers fire this before\n    // \"resize\" or not at all when the layout viewport changes.\n    this.onFsChange = () => {\n      const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;\n      this.setState({ isFullscreen: !!fsEl, vw: window.innerWidth, vh: window.innerHeight });\n    };\n    document.addEventListener(\"fullscreenchange\", this.onFsChange);\n    document.addEventListener(\"webkitfullscreenchange\", this.onFsChange);\n    document.addEventListener(\"MSFullscreenChange\", this.onFsChange);\n  }\n\n  componentWillUnmount() {\n    clearTimeout(this.idleTimer);\n    if (this.idleEvents) this.idleEvents.forEach(ev => document.removeEventListener(ev, this.idleReset, true));\n    window.removeEventListener(\"resize\", this.onResize);\n    document.removeEventListener(\"keydown\", this.onModalKeys);\n    document.removeEventListener(\"fullscreenchange\", this.onFsChange);\n    document.removeEventListener(\"webkitfullscreenchange\", this.onFsChange);\n    document.removeEventListener(\"MSFullscreenChange\", this.onFsChange);\n  }\n\n  toggleFullscreen() {\n    const el = document.documentElement;\n    const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;\n    if (!fsEl) {\n      const request = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;\n      if (request) {\n        // Older prefixed implementations (still found on some Android\n        // WebViews) don't return a Promise — only chain .catch if it did.\n        const p = request.call(el);\n        if (p && typeof p.catch === \"function\") p.catch(() => {});\n      }\n    } else {\n      const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;\n      if (exit) exit.call(document);\n    }\n  }\n\n  // Moves focus into the modal's close button when it opens, and restores\n  // focus to whatever triggered it when it closes — otherwise focus is lost\n  // to <body> and a keyboard user has to Tab from scratch.\n  componentDidUpdate() {\n    const isOpen = !!this.state.modalKey;\n    if (isOpen && !this.__modalWasOpen) {\n      this.__preModalFocus = document.activeElement;\n      requestAnimationFrame(() => {\n        const btn = document.getElementById(\"sf-modal-close\");\n        if (btn) btn.focus();\n      });\n    } else if (!isOpen && this.__modalWasOpen) {\n      if (this.__preModalFocus && document.contains(this.__preModalFocus)) {\n        this.__preModalFocus.focus();\n      }\n      this.__preModalFocus = null;\n    }\n    this.__modalWasOpen = isOpen;\n  }\n\n  // Wraps a click handler so the same control also responds to Enter/Space\n  // for keyboard users on role=\"button\" elements.\n  kbd(fn) {\n    return (e) => {\n      if (e.key === \"Enter\" || e.key === \" \" || e.key === \"Spacebar\") {\n        e.preventDefault();\n        fn(e);\n      }\n    };\n  }\n\n  goHome() {\n    this.setState({ view: \"inicio\", modalKey: null, qIndex: 0, score: 0, selected: null, showResult: false, nameInput: \"\", saved: false });\n  }\n\n  saveScore() {\n    const name = (this.state.nameInput || \"\").trim();\n    if (!name || this.state.saved) return;\n    const entry = { name: name, score: this.state.score };\n    const list = (this.state.scores || []).concat([entry]).sort((a, b) => b.score - a.score).slice(0, 10);\n    try { localStorage.setItem(\"sf_leaderboard\", JSON.stringify(list)); } catch (e) {}\n    this.setState({ scores: list, saved: true, lastSaved: entry });\n  }\n\n  svg(paths, stroke, size) {\n    return React.createElement(\"svg\", { width: size || 56, height: size || 56, viewBox: \"0 0 24 24\", fill: \"none\", stroke: stroke, strokeWidth: 2, strokeLinecap: \"round\", strokeLinejoin: \"round\" },\n      paths.map((d, i) => React.createElement(\"path\", { key: i, d: d })));\n  }\n\n  contentMap() {\n    return {\n      alertas: { color: \"#E53935\", tint: \"#FFEBEE\", kicker: \"Alertas de vencimiento\", title: \"Sabe qué se vence, antes que tú\",\n        body: \"Cada producto muestra su estado en color — del rojo al verde. Recibe avisos de lo que está por vencer y evita botar comida.\",\n        icon: this.svg([\"M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\", \"M12 9v4\", \"M12 17h.01\"], \"#E53935\") },\n      escaner: { color: \"#2CA456\", tint: \"#EAF7EF\", kicker: \"Escáner de códigos\", title: \"Agrégalo en segundos\",\n        body: \"Escanea el código de barras del producto y lo registramos por ti, con nombre y datos autocompletados. Sin escribir nada.\",\n        icon: this.svg([\"M3 7V5a2 2 0 0 1 2-2h2\", \"M17 3h2a2 2 0 0 1 2 2v2\", \"M21 17v2a2 2 0 0 1-2 2h-2\", \"M7 21H5a2 2 0 0 1-2-2v-2\", \"M7 12h10\"], \"#2CA456\") },\n      chef: { color: \"#2CA456\", tint: \"#EAF7EF\", kicker: \"Nuevo · Chef IA\", title: \"Te dice qué cocinar hoy\",\n        body: \"La IA propone recetas con lo que ya tienes y con lo que está por vencer — reduce tu desperdicio y te da ideas cada día.\",\n        icon: this.svg([\"M12 3v4\", \"M12 17v4\", \"M3 12h4\", \"M17 12h4\", \"M6.3 6.3l2.4 2.4\", \"M15.3 15.3l2.4 2.4\", \"M17.7 6.3l-2.4 2.4\", \"M8.7 15.3l-2.4 2.4\"], \"#2CA456\") },\n      cur1: { color: \"#2CA456\", tint: \"#EAF7EF\", kicker: \"¿Sabías qué?\", title: \"Se desperdicia 1 de cada 3 alimentos\",\n        body: \"Cada año se pierde o bota cerca de un tercio de toda la comida producida en el mundo. Planificar y controlar el vencimiento es la forma más simple de evitarlo.\",\n        icon: this.svg([\"M3 6h18\", \"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6\", \"M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\", \"M10 11v6\", \"M14 11v6\"], \"#2CA456\") },\n      cur2: { color: \"#F5A623\", tint: \"#FEF3E0\", kicker: \"¿Sabías qué?\", title: \"Los plátanos aceleran a sus vecinos\",\n        body: \"Liberan gas etileno que hace madurar más rápido a las frutas cercanas. Guárdalos aparte si quieres que todo dure más.\",\n        icon: this.svg([\"M12 2a10 10 0 1 0 10 10\", \"M12 2a10 10 0 0 1 10 10\", \"M8 14s1.5 2 4 2 4-2 4-2\"], \"#F5A623\") },\n      cur3: { color: \"#2CA456\", tint: \"#EAF7EF\", kicker: \"¿Sabías qué?\", title: \"El pan dura más en el congelador\",\n        body: \"Congelarlo detiene el proceso que lo pone duro. Puedes tostarlo directo del congelador y queda como recién hecho.\",\n        icon: this.svg([\"M2 12h20\", \"M12 2v20\", \"M12 2 8 6\", \"M12 2l4 4\", \"M12 22l-4-4\", \"M12 22l4-4\", \"M2 12l4-4\", \"M2 12l4 4\", \"M22 12l-4-4\", \"M22 12l-4 4\"], \"#2CA456\") },\n      cur4: { color: \"#E53935\", tint: \"#FFEBEE\", kicker: \"¿Sabías qué?\", title: \"La puerta es la zona más cálida\",\n        body: \"Ahí la temperatura sube y baja al abrir. Reserva la puerta para salsas y bebidas — la leche y los huevos van en los estantes centrales.\",\n        icon: this.svg([\"M5 3h14a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z\", \"M4 10h16\", \"M8 6v1\", \"M8 13v2\"], \"#E53935\") }\n    };\n  }\n\n  questions() {\n    return [\n      { q: \"¿Para qué sirve \\\"Alertas de vencimiento\\\" en SmartFridge?\", opts: [\"Para pedir comida a domicilio\", \"Para avisarte antes de que un producto venza\", \"Para calcular calorías\"], correct: 1,\n        fact: \"SmartFridge te notifica cuando un producto está por vencer, así lo usas a tiempo y evitas botarlo.\" },\n      { q: \"Una vez abierta, ¿cuántos días dura la leche bien refrigerada?\", opts: [\"1 día\", \"4–5 días\", \"2 semanas\"], correct: 1,\n        fact: \"Bien tapada y a menos de 4°C, la leche abierta se conserva entre 4 y 5 días sin perder calidad.\" },\n      { q: \"¿Cómo registras un producto con el Escáner de códigos?\", opts: [\"Escribiendo el nombre a mano\", \"Escaneando el código de barras del envase\", \"Sacando una foto del refrigerador completo\"], correct: 1,\n        fact: \"El escáner lee el código de barras y autocompleta nombre y datos del producto — no hay que escribir nada.\" },\n      { q: \"¿En qué parte del refrigerador conviene guardar los huevos?\", opts: [\"En la puerta\", \"En un estante central\", \"Fuera del refrigerador\"], correct: 1,\n        fact: \"Los estantes centrales mantienen una temperatura estable; en la puerta sube y baja cada vez que se abre.\" },\n      { q: \"¿Qué hace el Chef IA de SmartFridge?\", opts: [\"Pide un domicilio automáticamente\", \"Sugiere recetas con lo que ya tienes, priorizando lo por vencer\", \"Enciende el refrigerador de forma remota\"], correct: 1,\n        fact: \"El Chef IA propone recetas con los ingredientes que ya tienes, priorizando los que están por vencer.\" },\n      { q: \"Según la FAO, ¿cuánta comida producida en el mundo se pierde o desperdicia?\", opts: [\"Un 5%\", \"Cerca de un tercio\", \"Un 60%\"], correct: 1,\n        fact: \"La FAO estima que cerca de un tercio de todos los alimentos producidos en el planeta se pierde o desperdicia.\" },\n      { q: \"¿Cuál es el objetivo principal de SmartFridge?\", opts: [\"Vender refrigeradores nuevos\", \"Controlar tu inventario y reducir el desperdicio de comida\", \"Reemplazar las compras del supermercado\"], correct: 1,\n        fact: \"SmartFridge es un gestor de inventario: registra tus alimentos, controla vencimientos y te ayuda a desperdiciar menos.\" },\n      { q: \"¿Es buena idea guardar las papas crudas en el refrigerador?\", opts: [\"Sí, siempre\", \"No, mejor en un lugar fresco y oscuro\", \"Solo si están peladas\"], correct: 1,\n        fact: \"El frío convierte su almidón en azúcar y cambia su sabor y textura. Mejor un lugar fresco, seco y oscuro.\" },\n      { q: \"Además del refrigerador, ¿qué otro espacio ayuda a controlar SmartFridge?\", opts: [\"Solo el refrigerador\", \"También la despensa\", \"Solo el congelador\"], correct: 1,\n        fact: \"SmartFridge gestiona tanto el refrigerador como la despensa, para que ningún producto se pierda de vista.\" },\n      { q: \"¿Cuál es la temperatura ideal dentro de un refrigerador?\", opts: [\"Entre 0°C y 1°C\", \"Entre 1°C y 4°C\", \"Entre 8°C y 10°C\"], correct: 1,\n        fact: \"Entre 1°C y 4°C se frena el crecimiento de bacterias sin llegar a congelar los alimentos.\" }\n    ];\n  }\n\n  tabStyle(active) {\n    const base = \"padding:16px 30px; border-radius:999px; font-size:24px; font-weight:600; letter-spacing:0.2px; transition:all 0.15s ease; \";\n    return active\n      ? base + \"background:#2CA456; color:#fff; box-shadow:0 6px 16px rgba(44,164,86,0.3);\"\n      : base + \"background:transparent; color:#5F6368;\";\n  }\n\n  renderVals() {\n    const c = this.contentMap();\n    const isLeaderboardModal = this.state.modalKey === \"leaderboard\";\n    const m = (this.state.modalKey && !isLeaderboardModal) ? c[this.state.modalKey] : null;\n    const qs = this.questions();\n    const q = qs[this.state.qIndex];\n    const answered = this.state.selected !== null;\n    const isLast = this.state.qIndex === qs.length - 1;\n\n    const options = q ? q.opts.map((label, i) => {\n      let style = \"display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; text-align:left; background:#fff; border:2px solid #DADCE0; border-radius:16px; padding:15px 24px; font-size:22px; font-weight:600; color:#3C4043;\";\n      let mark = \"\", markStyle = \"display:none;\";\n      if (answered) {\n        if (i === q.correct) {\n          style = \"display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; text-align:left; background:#EAF7EF; border:2px solid #2CA456; border-radius:16px; padding:15px 24px; font-size:22px; font-weight:700; color:#1E7A3F;\";\n          mark = \"✓\"; markStyle = \"font-size:28px; font-weight:700; color:#2CA456;\";\n        } else if (i === this.state.selected) {\n          style = \"display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; text-align:left; background:#FFEBEE; border:2px solid #E53935; border-radius:16px; padding:15px 24px; font-size:22px; font-weight:700; color:#E53935;\";\n          mark = \"✕\"; markStyle = \"font-size:28px; font-weight:700; color:#E53935;\";\n        } else {\n          style += \" opacity:0.5;\";\n        }\n      }\n      const onClick = () => { if (this.state.selected === null) this.answer(i); };\n      return { label, style, mark, markStyle, onClick, onKeyDown: this.kbd(onClick) };\n    }) : [];\n\n    const verdict = this.state.score >= Math.ceil(qs.length * 0.8) ? \"¡Excelente! Cuidas tu refrigerador como un experto.\"\n      : this.state.score >= Math.ceil(qs.length * 0.5) ? \"¡Bien! Ya sabes reducir el desperdicio.\"\n      : \"Sigue aprendiendo — cada dato cuenta contra el desperdicio.\";\n\n    const curiosities = [\"cur1\", \"cur2\", \"cur3\", \"cur4\"].map(k => {\n      const onClick = () => this.setState({ modalKey: k });\n      return { title: c[k].title, color: c[k].color, tint: c[k].tint, icon: c[k].icon, onClick, onKeyDown: this.kbd(onClick) };\n    });\n\n    const goInicio = () => this.setState({ view: \"inicio\" });\n    const goSaber = () => this.setState({ view: \"saber\" });\n    const goJuego = () => this.setState({ view: \"juego\", qIndex: 0, score: 0, selected: null, showResult: false, nameInput: \"\", saved: false, lastSaved: null });\n    const openAlertas = () => this.setState({ modalKey: \"alertas\" });\n    const openEscaner = () => this.setState({ modalKey: \"escaner\" });\n    const openChef = () => this.setState({ modalKey: \"chef\" });\n    const openLeaderboard = () => this.setState({ modalKey: \"leaderboard\" });\n    const close = () => this.setState({ modalKey: null });\n    const quizNext = () => this.next();\n    const quizRestart = () => this.setState({ qIndex: 0, score: 0, selected: null, showResult: false, nameInput: \"\", saved: false, lastSaved: null });\n    const saveScore = () => this.saveScore();\n    const toggleFullscreen = () => this.toggleFullscreen();\n    const el = typeof document !== \"undefined\" ? document.documentElement : null;\n    const fsSupported = !!(el && (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen));\n\n    return {\n      stageScale: Math.min(this.state.vw / 1920, this.state.vh / 1080),\n\n      fsSupported,\n      isFullscreen: this.state.isFullscreen,\n      fsLabel: this.state.isFullscreen ? \"Salir de pantalla completa\" : \"Pantalla completa\",\n      toggleFullscreen, toggleFullscreenKbd: this.kbd(toggleFullscreen),\n\n      isInicio: this.state.view === \"inicio\",\n      isSaber: this.state.view === \"saber\",\n      isJuego: this.state.view === \"juego\",\n      goInicio, goInicioKbd: this.kbd(goInicio),\n      goSaber, goSaberKbd: this.kbd(goSaber),\n      goJuego, goJuegoKbd: this.kbd(goJuego),\n      tabInicioStyle: this.tabStyle(this.state.view === \"inicio\"),\n      tabSaberStyle: this.tabStyle(this.state.view === \"saber\"),\n      tabJuegoStyle: this.tabStyle(this.state.view === \"juego\"),\n\n      openAlertas, openAlertasKbd: this.kbd(openAlertas),\n      openEscaner, openEscanerKbd: this.kbd(openEscaner),\n      openChef, openChefKbd: this.kbd(openChef),\n      openLeaderboard, openLeaderboardKbd: this.kbd(openLeaderboard),\n      close, closeKbd: this.kbd(close),\n      stop: (e) => e.stopPropagation(),\n      modalOpen: !!this.state.modalKey,\n      modalIsLeaderboard: isLeaderboardModal,\n      modalColor: isLeaderboardModal ? \"#F5A623\" : (m ? m.color : \"#2CA456\"),\n      modalTint: isLeaderboardModal ? \"#FEF3E0\" : (m ? m.tint : \"#EAF7EF\"),\n      modalKicker: isLeaderboardModal ? \"Ranking\" : (m ? m.kicker : \"\"),\n      modalTitle: isLeaderboardModal ? \"Mejores puntajes\" : (m ? m.title : \"\"),\n      modalBody: isLeaderboardModal ? \"\" : (m ? m.body : \"\"),\n      modalIcon: isLeaderboardModal\n        ? this.svg([\"M6 9H4.5a2.5 2.5 0 0 1 0-5H6\", \"M18 9h1.5a2.5 2.5 0 0 0 0-5H18\", \"M4 22h16\", \"M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22\", \"M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22\", \"M18 2H6v7a6 6 0 0 0 12 0V2Z\"], \"#F5A623\")\n        : (m ? m.icon : null),\n\n      curiosities,\n\n      quizPlaying: !this.state.showResult,\n      quizShowResult: this.state.showResult,\n      quizProgress: \"Pregunta \" + (this.state.qIndex + 1) + \" de \" + qs.length,\n      quizScore: this.state.score,\n      quizTotal: qs.length,\n      quizQuestion: q ? q.q : \"\",\n      quizOptions: options,\n      quizAnswered: answered,\n      quizFact: q ? q.fact : \"\",\n      quizNextLabel: isLast ? \"Ver resultado\" : \"Siguiente pregunta\",\n      quizNext, quizNextKbd: this.kbd(quizNext),\n      quizRestart, quizRestartKbd: this.kbd(quizRestart),\n      quizVerdict: verdict,\n      nameInput: this.state.nameInput || \"\",\n      onName: (e) => this.setState({ nameInput: e.target.value }),\n      onNameKeyDown: (e) => { if (e.key === \"Enter\") saveScore(); },\n      saveScore, saveScoreKbd: this.kbd(saveScore),\n      canRegister: !this.state.saved,\n      saveBtnStyle: \"padding:13px 24px; border-radius:14px; font-size:20px; font-weight:700; color:#fff; background:#2CA456; display:flex; align-items:center; white-space:nowrap;\" + ((this.state.nameInput || \"\").trim().length > 0 ? \"\" : \" opacity:0.45;\"),\n      hasScores: (this.state.scores || []).length > 0,\n      noScores: (this.state.scores || []).length === 0,\n      scoreboard: (this.state.scores || []).slice(0, 5).map((s, i) => {\n        const isYou = s === this.state.lastSaved;\n        const bg = [\"#F5C518\", \"#B8C2CC\", \"#CD8B62\"][i] || \"#DADCE0\";\n        return {\n          rank: i + 1, name: s.name, score: s.score,\n          style: \"display:flex; align-items:center; gap:14px; border-radius:14px; padding:11px 16px; \" + (isYou ? \"background:#EAF7EF; border:1px solid #2CA456;\" : \"background:#F8F9FA;\"),\n          rankStyle: \"width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; color:#fff; flex:0 0 auto; background:\" + bg + \";\"\n        };\n      })\n    };\n  }\n\n  answer(i) {\n    const qs = this.questions();\n    const correct = i === qs[this.state.qIndex].correct;\n    this.setState(s => ({ selected: i, score: correct ? s.score + 1 : s.score }));\n  }\n\n  next() {\n    const qs = this.questions();\n    if (this.state.qIndex >= qs.length - 1) {\n      this.setState({ showResult: true });\n    } else {\n      this.setState(s => ({ qIndex: s.qIndex + 1, selected: null }));\n    }\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"
